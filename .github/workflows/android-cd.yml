# ============================================================
# Android CD (자동 배포 준비) 워크플로
# ------------------------------------------------------------
# 한 줄 요약:
#   개발자가 main 브랜치에 코드를 올리면, GitHub가 알아서
#   "안드로이드 앱 설치 파일"을 만들어서 보관해 주는 자동화 설정입니다.
#
# 용어 설명
#   - CD (Continuous Delivery): 앱을 사용자에게 내보낼 수 있는 상태로
#     자동으로 만들어 두는 과정
#   - main 브랜치: 프로젝트의 "최종 완성본"이 모이는 곳
#   - 워크플로: 자동으로 실행되는 작업 순서표
# ============================================================

# 이 자동화의 이름 (GitHub 화면의 Actions 탭에 표시됩니다)
name: Android CD

# ------------------------------------------------------------
# [언제 실행할까?]
# ------------------------------------------------------------
on:
  push:                 # 누군가 코드를 올리면(push)
    branches:
      - main            # 단, "main" 브랜치(최종 완성본)에 올렸을 때만 실행

# ------------------------------------------------------------
# [무슨 일을 할까?]
# ------------------------------------------------------------
jobs:
  build-android:                 # 작업 하나의 내부 이름
    name: Build Android          # 화면에 표시되는 작업 이름 ("안드로이드 빌드")
    runs-on: ubuntu-latest       # 작업을 수행할 임시 컴퓨터 (GitHub가 빌려주는 최신 리눅스 서버)

    # 아래 steps는 위에서부터 순서대로 실행됩니다.
    # 중간에 하나라도 실패하면 이후 단계는 실행되지 않습니다.
    steps:

      # 1단계: 소스코드 내려받기
      # 빌려온 빈 컴퓨터에는 아무것도 없으므로, 우리 프로젝트 코드를 가져옵니다.
      - name: Checkout
        uses: actions/checkout@v4     # GitHub에서 제공하는 "코드 내려받기" 기능

      # 2단계: Flutter 설치
      # Flutter는 앱을 만드는 도구입니다. 빈 컴퓨터에는 없으니 설치합니다.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2   # Flutter 설치를 대신해 주는 공개 기능
        with:
          channel: stable                  # 가장 안정적인 버전 계열을 사용
          flutter-version-file: .fvmrc     # 프로젝트에 적힌 "지정 버전"을 따라 설치
          # (팀원 모두 같은 버전을 쓰도록 하기 위함)
          cache: true                      # 설치 파일을 저장해 두어 다음 실행부터 더 빠르게

      # 3단계: Flutter 버전 확인
      # 실제로 어떤 버전이 설치됐는지 기록에 남깁니다. (문제 생길 때 원인 추적용)
      - name: Flutter Version
        run: flutter --version

      # 4단계: 필요한 부품(라이브러리) 설치
      # 앱은 다른 사람이 만든 부품(패키지)을 가져다 씁니다. 그 목록대로 내려받습니다.
      - name: Install dependencies
        run: flutter pub get

      # 5단계: 앱 서명 준비
      # 안드로이드 앱은 "누가 만들었는지 증명하는 도장(서명)"이 있어야 스토어에 올릴 수 있습니다.
      # 이 도장 파일(키스토어)과 비밀번호는 코드에 직접 적으면 유출 위험이 있으므로,
      # GitHub의 금고(Secrets)에 따로 보관해 두고 여기서 꺼내 씁니다.
      - name: Prepare Android signing
        env:
          # 금고(Secrets)에 저장된 값을 이 단계에서만 임시로 불러옵니다.
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}      # 도장 파일(글자로 변환된 형태)
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}  # 도장 파일의 비밀번호
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}                  # 도장의 이름표
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}            # 도장 자체의 비밀번호
        run: |
          # 금고에는 파일을 글자 형태(base64)로 저장해 두었으므로,
          # 이를 원래의 도장 파일(.jks)로 복원해서 android/app 폴더에 저장합니다.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          # 도장 파일의 사용 정보(비밀번호, 이름표, 파일 위치)를
          # key.properties라는 설정 파일로 만들어 둡니다.
          # 안드로이드 빌드 도구가 이 파일을 읽고 서명을 진행합니다.
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

      # 6단계: APK 만들기
      # APK는 안드로이드 폰에 직접 설치할 수 있는 앱 파일입니다.
      # (테스트용으로 지인이나 테스터에게 전달할 때 주로 사용)
      # --release 는 "실제 배포용(최적화된) 버전"으로 만들라는 뜻입니다.
      - name: Build Android APK
        run: flutter build apk --release

      # 7단계: AAB 만들기
      # AAB는 구글 플레이 스토어에 올리기 위한 전용 형식입니다.
      # 스토어가 사용자 폰 기종에 맞게 알아서 용량을 최적화해 줍니다.
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 8단계: APK 파일 보관
      # 빌려온 컴퓨터는 작업이 끝나면 사라지므로, 결과물을 GitHub에 따로 저장합니다.
      # 저장된 파일은 Actions 실행 결과 화면에서 내려받을 수 있습니다.
      - name: Upload APK
        uses: actions/upload-artifact@v4          # 결과물 저장 기능
        with:
          name: android-apk                       # 저장될 때 표시되는 이름
          path: build/app/outputs/flutter-apk/app-release.apk   # 보관할 파일의 위치
          retention-days: 7                       # 7일 후 자동 삭제 (저장 공간 절약)

      # 9단계: AAB 파일 보관
      # 구글 플레이 스토어 업로드용 파일도 같은 방식으로 저장합니다.
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7                       # 7일 후 자동 삭제