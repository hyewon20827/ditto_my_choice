name: Android CD

on:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      # 1단계: 소스코드 내려받기
      - name: Checkout
        uses: actions/checkout@v4

      # 2단계: Flutter 설치
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.6"   # ← 수정: ci.yml과 같은 버전으로 고정 (.fvmrc 제거)
          cache: true

      # 3단계: Flutter 버전 확인
      - name: Flutter Version
        run: flutter --version

      # 4단계: 라이브러리 설치
      - name: Install dependencies
        run: flutter pub get

      # 5단계: 앱 서명 준비
      # 금고(Secrets)의 값으로 키스토어 파일과 key.properties를 복원합니다.
      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |                        # ← 수정: | 추가 (여러 줄 명령)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # 5-1단계: 서명 파일이 제대로 만들어졌는지 확인  ← 새로 추가
      # 실패하면 여기서 멈춰서, debug 서명으로 잘못 빌드되는 일을 막아 줍니다.
      - name: Verify signing files
        run: |
          test -f android/key.properties
          test -s android/app/upload-keystore.jks

      # 6단계: APK 만들기
      - name: Build Android APK
        run: flutter build apk --release

      # 7단계: AAB 만들기
      - name: Build Android App Bundle
        run: flutter build appbundle --release

      # 8단계: APK 보관
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      # 9단계: AAB 보관
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7